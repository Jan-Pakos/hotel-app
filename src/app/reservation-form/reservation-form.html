<div class="form-container">
  <h2>New Reservation</h2>
  <form class="reservation-form" [formGroup]="reservationForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="guestName">Guest Name</label>
      <input type="text" id="guestName" formControlName="guestName" placeholder="Enter guest name">
    </div>

    <div class="form-group">
      <label for="guestEmail">Guest Email</label>
      <input type="email" id="guestEmail" formControlName="guestEmail" placeholder="Enter guest email">
      @if (reservationForm.get('guestEmail')?.invalid && reservationForm.get('guestEmail')?.touched) {
        <span class="error">Please enter a valid email address.</span>
      }
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="checkInDate">Check-in Date</label>
        <input type="date" id="checkInDate" formControlName="checkInDate">
      </div>

      <div class="form-group">
        <label for="checkOutDate">Check-out Date</label>
        <input type="date" id="checkOutDate" formControlName="checkOutDate">
      </div>
    </div>

    <div class="form-group">
      <label for="roomNumber">Room Number</label>
      <input type="number" id="roomNumber" formControlName="roomNumber" placeholder="Enter room number">
    </div>

    <button type="submit">Create Reservation</button>
  </form>
</div>
