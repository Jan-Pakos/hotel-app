<div class="form-container">
  <h2>New Reservation</h2>
  <form class="reservation-form">
    <div class="form-group">
      <label for="guestName">Guest Name</label>
      <input type="text" id="guestName" name="guestName" placeholder="Enter guest name" required>
    </div>

    <div class="form-group">
      <label for="guestEmail">Guest Email</label>
      <input type="email" id="guestEmail" name="guestEmail" placeholder="Enter guest email"
             [(ngModel)]="guestEmail" #emailInput="ngModel" required email>
      @if (emailInput.invalid && emailInput.touched) {
        <span class="error">Please enter a valid email address.</span>
      }
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="checkInDate">Check-in Date</label>
        <input type="date" id="checkInDate" name="checkInDate" required>
      </div>

      <div class="form-group">
        <label for="checkOutDate">Check-out Date</label>
        <input type="date" id="checkOutDate" name="checkOutDate" required>
      </div>
    </div>

    <div class="form-group">
      <label for="roomNumber">Room Number</label>
      <input type="number" id="roomNumber" name="roomNumber" placeholder="Enter room number" required>
    </div>

    <button type="submit" (click)="onSubmit()">Create Reservation</button>
  </form>
</div>
